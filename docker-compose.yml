# ============================================================
# Planning Poker — Base compose (production-ready defaults)
# ============================================================
# Run for production:
#   docker compose -f docker-compose.yml up -d --build
#
# Run for development (auto-loads docker-compose.override.yml):
#   docker compose up --build
# ============================================================

services:
  app:
    build:
      context: .
      target: prod
    image: planning-poker:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ROOM_EXPIRATION_TIME: ${ROOM_EXPIRATION_TIME:-3600}
      PORT: 3000
    depends_on:
      - redis

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
